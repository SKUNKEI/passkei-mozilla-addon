<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>PassKei by SKUNKEI</title>
    <link rel="stylesheet" href="popup.css" />
</head>
<body>
    <main class="pk-popup" aria-label="PassKei">
        <header class="pk-header">
            <a class="pk-brand" href="https://pass.skunkei.com/" target="_blank" rel="noopener noreferrer" aria-label="Open PassKei">
                <img class="pk-brandmark" src="logo.png" alt="" aria-hidden="true" />
                <span class="pk-h1">PassKei</span>
            </a>
            <div class="pk-header-actions">
                <button class="pk-add-btn" id="pkAddPasswordBtn" type="button" title="Add password" hidden>
                    <span aria-hidden="true">＋</span>
                    <span>Add</span>
                </button>
                <button class="pk-icon-btn pk-logout-btn" id="pkLogoutBtn" type="button" title="Sign out" hidden aria-label="Sign out">⎋</button>
            </div>
        </header>

        <div id="pkLogoutConfirm" class="pk-confirm" hidden>
            <div class="pk-confirm-card" role="dialog" aria-modal="true" aria-labelledby="pkLogoutConfirmTitle">
                <h2 id="pkLogoutConfirmTitle">Sign out?</h2>
                <div class="pk-confirm-actions">
                    <button type="button" class="pk-btn pk-btn-secondary" id="pkCancelLogoutBtn">Cancel</button>
                    <button type="button" class="pk-btn pk-btn-danger" id="pkConfirmLogoutBtn">Signout</button>
                </div>
            </div>
        </div>

        <section id="pkLoginPanel" class="pk-panel" hidden>
            <div class="pk-alert" id="pkLoginFeedback" role="alert" hidden></div>
            <form id="pkLoginForm" novalidate>
                <label class="pk-field">
                    <span>Email address</span>
                    <input type="email" id="pkEmail" autocomplete="username" required />
                </label>
                <label class="pk-field">
                    <span>Master password</span>
                    <input type="password" id="pkPassword" autocomplete="current-password" required />
                </label>
                <label class="pk-check">
                    <input type="checkbox" id="pkRemember" checked />
                    <span>Keep me signed in</span>
                </label>
                <button class="pk-btn pk-btn-primary pk-full" id="pkLoginSubmit" type="submit">Sign in</button>
            </form>
        </section>

        <section id="pkVaultPanel" class="pk-panel" hidden>
            <input type="search" class="pk-search" id="pkSearchInput" placeholder="Search vault..." />
            <ul class="pk-item-list" id="pkItemList"></ul>
        </section>

        <section id="pkSavePanel" class="pk-panel" hidden>
            <h2 class="pk-save-title">Save new login?</h2>
            <p class="pk-muted" id="pkSaveDetails">Save this login to your PassKei vault.</p>
            <label class="pk-field">
                <span>Website</span>
                <input type="text" id="pkSaveSite" autocomplete="url" />
            </label>
            <label class="pk-field">
                <span>Username</span>
                <input type="text" id="pkSaveUsername" autocomplete="username" />
            </label>
            <label class="pk-field">
                <span>Password</span>
                <input type="password" id="pkSavePassword" autocomplete="new-password" />
            </label>
            <div class="pk-confirm-actions">
                <button class="pk-btn pk-btn-secondary" id="pkCancelSaveBtn" type="button">Cancel</button>
                <button class="pk-btn pk-btn-primary" id="pkConfirmSaveBtn" type="button">Save new login</button>
            </div>
            <div class="pk-alert" id="pkSaveFeedback" role="alert" hidden></div>
        </section>
    </main>
    <script type="module" src="popup.js"></script>
</body>
</html>
